name: Build Windows x64

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  PROJECT: src/ST.Client.Desktop.Avalonia.App/ST.Client.Avalonia.App.csproj

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x

      - name: Restore Windows x64
        run: dotnet restore $env:PROJECT --runtime win7-x64 -p:Platform=x64 -p:Configuration=Release

      - name: Build Windows x64
        run: dotnet build $env:PROJECT --configuration Release --runtime win7-x64 --no-restore -p:Platform=x64

      - name: Publish self-contained Windows x64
        run: dotnet publish $env:PROJECT --configuration Release --no-restore -p:PublishProfile=win-x64 -p:ExtraDefineConstants=win-x64

      - name: Publish framework-dependent Windows x64
        run: dotnet publish $env:PROJECT --configuration Release --no-restore -p:PublishProfile=fd-win-x64 -p:ExtraDefineConstants=fd-win-x64

      - name: Upload Windows x64 builds
        uses: actions/upload-artifact@v4
        with:
          name: SteamTools-Windows-x64
          path: |
            src/ST.Client.Desktop.Avalonia.App/bin/Release/Publish/win-x64/**
            src/ST.Client.Desktop.Avalonia.App/bin/Release/Publish/FrameworkDependent/win-x64/**
          if-no-files-found: error
