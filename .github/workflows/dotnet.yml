name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dotnet.yml"
      - "global.json"
      - "src/**"
      - "tests/ST.Client.UnitTest/**"
      - "references/**"
      - "Directory.*"
      - "NuGet.Config"
      - "*.sln"
      - "*.props"
      - "*.targets"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: src/ST.Client.Desktop.Avalonia.App/ST.Client.Avalonia.App.csproj
  PUBLISH_DIR: src/ST.Client.Desktop.Avalonia.App/bin/Release/Publish/win-x64
  TEST_PROJECT_PATH: tests/ST.Client.UnitTest/ST.Client.UnitTest.csproj
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: "true"

jobs:
  windows-release:
    name: Unsigned win-x64 Release
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 6.0.428

      - name: Verify SDK
        shell: pwsh
        run: |
          $sdkVersion = dotnet --version
          if ($sdkVersion -ne "6.0.428") {
            throw "Expected .NET SDK 6.0.428, got $sdkVersion"
          }
          dotnet --info

      - name: Run ST.Client unit tests
        shell: pwsh
        run: dotnet test $env:TEST_PROJECT_PATH --configuration Release --nologo

      - name: Publish unsigned self-contained win-x64 build
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            --configuration Release `
            --runtime win7-x64 `
            -p:PublishProfile=win-x64 `
            -p:DeployOnBuild=true `
            -p:ExtraDefineConstants=win-x64 `
            --nologo

      - name: Verify and describe artifact
        shell: pwsh
        run: |
          $executable = Join-Path $env:PUBLISH_DIR "Steam++.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Published executable was not found: $executable"
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $hash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          $buildInfo = @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "Upstream baseline: BeyondDimension/SteamTools 2.8.6 (6a5f8db69f92a98a0503234f3b34433e2924c1c1)"
            "Configuration: Release"
            "Runtime: win7-x64 (self-contained)"
            "Signing: unsigned test build"
            "SDK: 6.0.428"
            "Steam++.exe SHA256: $hash"
          )

          Set-Content -LiteralPath (Join-Path $env:PUBLISH_DIR "BUILD-INFO.txt") -Value $buildInfo -Encoding utf8
          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "### Windows Release artifact" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Commit: ``$env:GITHUB_SHA``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Steam++.exe SHA256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- This is an unsigned test build; Windows may display a SmartScreen warning." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows Release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SteamTool-2.8.6-adfree-win-x64-${{ env.SHORT_SHA }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 14
