name: Publish Windows x64

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  PROJECT: src/ST.Client.Desktop.Avalonia.App/ST.Client.Avalonia.App.csproj

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x

      - name: Restore Windows x64
        run: dotnet restore $env:PROJECT --runtime win7-x64 -p:Platform=x64 -p:Configuration=Release

      - name: Publish Windows x64 variants
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT --configuration Release --no-restore -p:PublishProfile=win-x64 -p:ExtraDefineConstants=win-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish $env:PROJECT --configuration Release --no-restore -p:PublishProfile=fd-win-x64 -p:ExtraDefineConstants=fd-win-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package Windows x64 variants
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = 'manual' }
          7z a "Steam++_${version}_win-x64.7z" ".\src\ST.Client.Desktop.Avalonia.App\bin\Release\Publish\win-x64\*"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          7z a "Steam++_${version}_fd-win-x64.7z" ".\src\ST.Client.Desktop.Avalonia.App\bin\Release\Publish\FrameworkDependent\win-x64\*"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SteamTools-Windows-x64
          path: Steam++_*_win-x64.7z
          if-no-files-found: error

      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" Steam++_*_win-x64.7z --clobber
